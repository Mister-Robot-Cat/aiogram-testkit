[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiogram-testkit"
version = "0.1.0"
description = "Testing utilities for aiogram 3.x"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiogram>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
